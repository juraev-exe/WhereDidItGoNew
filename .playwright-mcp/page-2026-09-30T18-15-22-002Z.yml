      - generic [ref=f1e26]:
        - heading "1. 100% Local-First Data Storage" [level=2] [ref=f1e27]
        - paragraph [ref=f1e28]:
          - text: WhereDidItGo ("we", "our", or "us") operates on a foundational
          - strong [ref=f1e29]: local-first
          - text: "architectural model. Your financial records are strictly yours:"
        - list [ref=f1e30]:
          - listitem [ref=f1e31]:
            - strong [ref=f1e32]: "On-Device Records:"
            - text: All transaction records, income logs, expenses, category budgets, debts, savings goals, and transaction notes are stored exclusively in your device's isolated IndexedDB local storage sandbox.
          - listitem [ref=f1e33]:
            - strong [ref=f1e34]: "Zero Server Transmission:"
            - text: We do not operate or maintain remote financial databases. We never transmit, upload, inspect, or process your personal bookkeeping records on external cloud servers.
          - listitem [ref=f1e35]:
            - strong [ref=f1e36]: "No Account Required:"
            - text: You do not need to register, create a username, or link an email address to use the application.
      - generic [ref=f1e37]:
        - heading "2. No Unnecessary Data & Permissions (Data Minimization)" [level=2] [ref=f1e38]
        - paragraph [ref=f1e39]: "We respect the principle of data minimization and request only the bare minimum operating system capabilities:"
        - list [ref=f1e40]:
          - listitem [ref=f1e41]:
            - strong [ref=f1e42]: "No Location Data:"
            - text: We never track, request, or record GPS or network locations.
          - listitem [ref=f1e43]:
            - strong [ref=f1e44]: "No Contacts / Address Book:"
            - text: We do not inspect or upload your contacts.
          - listitem [ref=f1e45]:
            - strong [ref=f1e46]: "No Camera / Media Access:"
            - text: The app does not access your camera, microphone, or photo gallery.
          - listitem [ref=f1e47]:
            - strong [ref=f1e48]: "Permitted OS Features:"
            - list [ref=f1e49]:
              - listitem [ref=f1e50]:
                - code [ref=f1e51]: VIBRATE
                - text: — provides subtle haptic clicks during numeric keypad logging.
              - listitem [ref=f1e52]:
                - code [ref=f1e53]: POST_NOTIFICATIONS
                - text: — allows you to receive optional local budget reminders if you choose to set them.
              - listitem [ref=f1e54]:
                - code [ref=f1e55]: INTERNET
                - text: — utilized strictly for Google Play / Apple App Store in-app billing verification.
      - generic [ref=f1e56]:
        - heading "3. In-App Purchases, Billing & No Hidden Fees" [level=2] [ref=f1e57]
        - paragraph [ref=f1e58]: "WhereDidItGo offers an optional upgrade (\"WhereDidItGo Pro\") to unlock advanced tools. All purchases are processed with complete transparency:"
        - list [ref=f1e59]:
          - listitem [ref=f1e60]:
            - text: Payments are executed directly through the official
            - strong [ref=f1e61]: Google Play Store
            - text: (Google Play Billing) or
            - strong [ref=f1e62]: Apple App Store
            - text: .
          - listitem [ref=f1e63]: We never receive or store your credit card credentials, debit card numbers, or billing addresses.
          - listitem [ref=f1e64]:
            - text: We utilize
            - strong [ref=f1e65]: RevenueCat
            - text: solely to validate store purchase receipts. RevenueCat receives an anonymous, randomly generated application user ID and the receipt token. No financial amounts or expense details are ever transmitted.
          - listitem [ref=f1e66]:
            - strong [ref=f1e67]: "No Hidden Fees:"
            - text: Pro licenses are clearly displayed with upfront pricing. There are no sneaky renewal charges, surprise fees, or dark patterns.
      - generic [ref=f1e68]:
        - heading "4. Third-Party SDK Audit" [level=2] [ref=f1e69]
        - paragraph [ref=f1e70]: "We routinely audit all software libraries to ensure user safety and compliance:"
        - list [ref=f1e71]:
          - listitem [ref=f1e72]:
            - strong [ref=f1e73]: "No Ad Networks:"
            - text: We contain zero ad network SDKs (no AdMob, Meta, Unity Ads, etc.).
          - listitem [ref=f1e74]:
            - strong [ref=f1e75]: "No Tracking / Profiling SDKs:"
            - text: We do not integrate Firebase Analytics, AppsFlyer, or behavioral tracking trackers.
          - listitem [ref=f1e76]:
            - text: Review our complete
            - link "Third-Party SDK Audit" [ref=f1e77] [cursor=pointer]:
              - /url: https://github.com/juraev-exe/wherediditgo/blob/main/THIRD_PARTY_AUDIT.md
            - text: for itemized technical breakdowns.
      - generic [ref=f1e78]:
        - heading "5. Age Consent & Children's Privacy (COPPA / GDPR-K)" [level=2] [ref=f1e79]
        - paragraph [ref=f1e80]: WhereDidItGo is designed for general audiences aged 18 and older. We do not knowingly solicit, collect, or process personal information from children under the age of 13 (or under 16 in the European Economic Area). Because the application operates without remote user accounts or data scraping, no identities or profiles of children are compiled.
      - generic [ref=f1e81]:
        - heading "6. Email Communications & Anti-Spam (Unsubscribe Guarantee)" [level=2] [ref=f1e82]
        - paragraph [ref=f1e83]: "We respect your inbox:"
        - list [ref=f1e84]:
          - listitem [ref=f1e85]: We do not send unsolicited promotional marketing emails or sell your email address.
          - listitem [ref=f1e86]:
            - text: When you email our support desk at
            - link "support@wherediditgo.app" [ref=f1e87] [cursor=pointer]:
              - /url: mailto:support@wherediditgo.app
            - text: ", your email is used solely to answer your question."
          - listitem [ref=f1e88]:
            - text: If any optional email announcement list is made available in the future, every message will feature a prominent, one-click
            - strong [ref=f1e89]: Unsubscribe
            - text: link complying with the CAN-SPAM Act and GDPR Article 7.
      - generic [ref=f1e90]:
        - heading "7. Data Deletion & Your Legal Rights (GDPR & CCPA)" [level=2] [ref=f1e91]
        - paragraph [ref=f1e92]: "You have full autonomy over your data under GDPR (Articles 15–22) and CCPA:"
        - list [ref=f1e93]:
          - listitem [ref=f1e94]:
            - strong [ref=f1e95]: "Instant Self-Service Erasure:"
            - text: Inside the app, go to
            - strong [ref=f1e96]: Settings → Danger Zone → Reset all local data
            - text: to permanently wipe all financial records immediately.
          - listitem [ref=f1e97]:
            - strong [ref=f1e98]: "Uninstalling the App:"
            - text: Deleting the app from your device automatically destroys the application's isolated local database.
          - listitem [ref=f1e99]:
            - strong [ref=f1e100]: "Data Export:"
            - text: You can export full JSON backups or CSV files at any time.
          - listitem [ref=f1e101]:
            - strong [ref=f1e102]: "Correspondence Erasure:"
            - text: To request deletion of any support email correspondence, consult our
            - link "Data Deletion Guide" [ref=f1e103] [cursor=pointer]:
              - /url: ./data-deletion.html
            - text: or email
            - link "support@wherediditgo.app" [ref=f1e104] [cursor=pointer]:
              - /url: mailto:support@wherediditgo.app
            - text: .
