        - article [ref=e65]:
          - heading "Budgets that stay monthly" [level=3] [ref=e66]
          - paragraph [ref=e67]: Cap groceries, bills, or transport. See what’s left this month — not a lifetime envelope mixed in with savings.
        - article [ref=e68]:
          - heading "Savings goals" [level=3] [ref=e69]
          - paragraph [ref=e70]: A trip, a gadget, an emergency fund. Move money from an account into a goal. It is not logged as a spend, and you pick any icon you like.
        - article [ref=e71]:
          - heading "Insights that aren’t a chart dump" [level=3] [ref=e72]
          - paragraph [ref=e73]: Pace vs the calendar, vs last month, biggest expense, weekdays vs weekends, budget health, and per-account in/out — plus category, daily, and six-month charts.
        - article [ref=e74]:
          - heading "Activity you can trust" [level=3] [ref=e75]
          - paragraph [ref=e76]: Search notes and categories, filter by month and type, swipe left to delete. Same compact rows as Home.
        - article [ref=e77]:
          - heading "Share the screen, not the numbers" [level=3] [ref=e78]
          - paragraph [ref=e79]: Tap the eye to blur the balance. Hold it to hide every amount — it stays that way after you leave the app.
