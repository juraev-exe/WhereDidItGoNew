<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WhereDidItGo</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#f3f0ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded non-render-blocking: this is an offline-first app, so a cold start
      with no connectivity must paint immediately on the system font rather than
      wait for Google Fonts to time out.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WhereDidItGo" />
  </head>
  <body>
    <div id="app">
      <style>
        .preboot {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #f2f2f7;
          color: #1c1c1e;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
          .preboot {
            background: #000000;
            color: #ffffff;
          }
        }
        .preboot-logo {
          width: 76px;
          height: 76px;
          border-radius: 20px;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        .preboot-spinner {
          width: 24px;
          height: 24px;
          color: #007aff;
          animation: prebootSpin 0.8s steps(8, end) infinite;
        }
        @keyframes prebootSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
      <div class="preboot">
        <img src="/logo.png" alt="Logo" class="preboot-logo" />
        <svg class="preboot-spinner" viewBox="0 0 24 24" fill="currentColor">
          <rect x="11" y="2" width="2" height="5" rx="1" opacity="1.0" />
          <rect x="11" y="2" width="2" height="5" rx="1" transform="rotate(45 12 12)" opacity="0.875" />
          <rect x="11" y="2" width="2" height="5" rx="1" transform="rotate(90 12 12)" opacity="0.75" />
          <rect x="11" y="2" width="2" height="5" rx="1" transform="rotate(135 12 12)" opacity="0.625" />
          <rect x="11" y="2" width="2" height="5" rx="1" transform="rotate(180 12 12)" opacity="0.5" />
          <rect x="11" y="2" width="2" height="5" rx="1" transform="rotate(225 12 12)" opacity="0.375" />
          <rect x="11" y="2" width="2" height="5" rx="1" transform="rotate(270 12 12)" opacity="0.25" />
          <rect x="11" y="2" width="2" height="5" rx="1" transform="rotate(315 12 12)" opacity="0.125" />
        </svg>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
