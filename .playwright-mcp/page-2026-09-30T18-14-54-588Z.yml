    - generic [ref=e36]:
      - heading "Your money never leaves this phone." [level=2] [ref=e37]
      - paragraph [ref=e38]: Transactions live in a local database on the device. There is no account to create, no cloud sync, and no analytics. Switch phones with a full JSON backup — or export transactions as CSV.
